name: event-driven-orders

x-service: &service
  build: ../system
  restart: on-failure
  environment: &service-env
    DATABASE_URL: postgres://orders:orders@postgres:5432/orders
    KAFKA_BROKERS: redpanda:9092
    REDIS_HOST: redis
    REDIS_PORT: '6379'
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    redpanda:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - '5433:5432'
    volumes:
      - ../system/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orders -d orders']
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      retries: 30

  redpanda:
    image: redpandadata/redpanda:v26.1.20
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - '19092:19092'
    healthcheck:
      test: ['CMD-SHELL', "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 3s
      retries: 40

  order-api:
    <<: *service
    command: ['node', 'src/order-api.js']
    environment:
      <<: *service-env
      SERVICE_NAME: order-api
    ports:
      - '3100:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 2s
      retries: 30

  payment-worker:
    <<: *service
    command: ['node', 'src/payment-worker.js']
    environment:
      <<: *service-env
      SERVICE_NAME: payment-worker

  inventory-worker:
    <<: *service
    command: ['node', 'src/inventory-worker.js']
    environment:
      <<: *service-env
      SERVICE_NAME: inventory-worker
