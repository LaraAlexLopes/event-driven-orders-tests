name: Event-driven E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

  e2e:
    name: Orders system (Kafka, BullMQ, PostgreSQL)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run system:up
      - run: npm test

      - name: Service logs
        if: failure()
        run: npm run system:logs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-report
          path: reports
          retention-days: 14

      - if: always()
        run: npm run system:down
